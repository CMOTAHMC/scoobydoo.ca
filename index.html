<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scoobydoo.ca</title>
<meta name="description" content="One of these cubes is a door.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,300;125,500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --graphite: #1C1D1F;
    --smoke: #7E8388;
    --bone: #D9DCDF;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--black);
    color: var(--bone);
    font-family: "Archivo", system-ui, sans-serif;
    font-stretch: 125%;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .mark {
    position: fixed;
    left: clamp(1rem, 5vw, 4rem);
    bottom: clamp(1.5rem, 6vh, 4rem);
    pointer-events: none;
    text-shadow: 0 1px 16px rgba(0, 0, 0, 0.9);
  }
  .mark h1 {
    font-weight: 300;
    font-size: clamp(1.5rem, 3.2vw, 2.5rem);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .mark p {
    margin-top: 0.5rem;
    font-weight: 300;
    font-size: 0.9375rem;
    color: var(--smoke);
  }
  .door {
    position: fixed;
    left: clamp(1rem, 5vw, 4rem);
    top: 1rem;
    padding: 0.5rem 0.75rem;
    color: var(--bone);
    background: var(--graphite);
    border: 1px solid var(--smoke);
    font-weight: 500;
    text-decoration: none;
    transform: translateY(-200%);
  }
  .door:focus-visible { transform: none; outline: 2px solid var(--bone); outline-offset: 2px; }
</style>
</head>
<body>

<a class="door" href="https://jellyfin.scoobydoo.ca">Open the door</a>
<canvas aria-label="A wall of glossy black cubes that sink back where you point, letting light through"></canvas>
<div class="mark">
  <h1>scoobydoo.ca</h1>
  <p>One of these cubes is a door.</p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const DOOR = "https://jellyfin.scoobydoo.ca";
const STEP = 0.40;            // grid spacing; the Blender cube is 0.36, leaving a 0.04 gap
const PUSH = 0.6;             // how far cubes sink under the pointer
const SIGMA2 = 2 * 1.0 * 1.0; // width of the press
const still = matchMedia("(prefers-reduced-motion: reduce)");

const canvas = document.querySelector("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(1.0, -0.5, 10);
camera.lookAt(0, 0, 0);

// Reflection environment: the same vertical gradient as the Blender world,
// bright overhead and fading to black below. Nothing with a shape to mirror.
const pmrem = new THREE.PMREMGenerator(renderer);
const skyScene = new THREE.Scene();
skyScene.add(new THREE.Mesh(
  new THREE.SphereGeometry(50, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: "varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: "varying vec3 vDir; void main(){ float t = pow(clamp((vDir.y + 0.3) / 1.3, 0.0, 1.0), 2.5); gl_FragColor = vec4(vec3(0.85, 0.86, 0.88) * t, 1.0); }",
  })
));
scene.environment = pmrem.fromScene(skyScene, 0).texture;
scene.environmentIntensity = 3.0;

const overhead = new THREE.DirectionalLight(0xffffff, 1.6);
overhead.position.set(0, 8, 6);
scene.add(overhead);

// Behind the wall: a backdrop that glows in a soft pool under the pointer,
// and a point light there that catches the sides of the sunken cubes.
const GLOW = new THREE.Color(1.0, 0.06, 0.04);      // red seep
const DOOR_GLOW = new THREE.Color(0.92, 0.95, 1.0); // the door glows white
const glowUniforms = {
  uCenter: { value: new THREE.Vector2(0, -99) },
  uStrength: { value: 0 },
  uColor: { value: GLOW.clone() },
};
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 50),
  new THREE.ShaderMaterial({
    uniforms: glowUniforms,
    vertexShader: "varying vec2 vXY; void main(){ vXY = (modelMatrix * vec4(position, 1.0)).xy; gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); }",
    fragmentShader: "uniform vec2 uCenter; uniform float uStrength; uniform vec3 uColor; varying vec2 vXY; void main(){ float f = pow(clamp(1.0 - length(vXY - uCenter) / 1.6, 0.0, 1.0), 2.2); gl_FragColor = vec4(uColor * f * uStrength * 3.0, 1.0); }",
  })
);
backdrop.position.z = -1.9;
scene.add(backdrop);

const backLight = new THREE.PointLight(0xff1008, 0, 2, 2);
backLight.position.set(0, 0, -1.1);
scene.add(backLight);

const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.08, metalness: 0 });
const lacquer = [new THREE.Color("#0c0c0c"), new THREE.Color("#161616")];

async function cubeGeometry() {
  try {
    const gltf = await new GLTFLoader().loadAsync("assets/cube.glb");
    let geo = null;
    gltf.scene.traverse(o => { if (!geo && o.isMesh) geo = o.geometry; });
    if (geo) return geo;
  } catch (err) {
    console.warn("cube.glb failed to load, using a built-in cube", err);
  }
  return new RoundedBoxGeometry(0.36, 0.36, 0.36, 3, 0.02);
}

let geometry, mesh, cubes = [], doorId = -1, cols = 0, rows = 0;

function visibleHalfExtents() {
  const h = camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return { w: h * camera.aspect, h };
}

function buildWall() {
  const ext = visibleHalfExtents();
  const c = Math.ceil((ext.w * 2 + 3) / STEP);
  const r = Math.ceil((ext.h * 2 + 3) / STEP);
  if (mesh && c === cols && r === rows) return;
  cols = c; rows = r;
  if (mesh) { scene.remove(mesh); mesh.dispose(); }
  mesh = new THREE.InstancedMesh(geometry, material, cols * rows);
  cubes = [];
  const doorSpot = new THREE.Vector2(-0.55 * ext.w, 0.35 * ext.h);
  let best = Infinity;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const x = (i - (cols - 1) / 2) * STEP;
      const y = (j - (rows - 1) / 2) * STEP;
      const id = cubes.length;
      cubes.push({ x, y, rest: (Math.random() - 0.5) * 0.06, phase: Math.random() * 6.283, push: 0 });
      mesh.setColorAt(id, lacquer[0].clone().lerp(lacquer[1], Math.random()));
      const d = doorSpot.distanceTo(new THREE.Vector2(x, y));
      if (d < best) { best = d; doorId = id; }
    }
  }
  scene.add(mesh);
}

// Pointer -> point on the wall plane.
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const wallPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hit = new THREE.Vector3(0, -99, 0);
let pointerOn = false, aimed = 0, overDoor = false;

function aim(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  pointerOn = !!ray.ray.intersectPlane(wallPlane, hit);
  const door = cubes[doorId];
  overDoor = pointerOn && !!door && Math.abs(hit.x - door.x) < STEP / 2 && Math.abs(hit.y - door.y) < STEP / 2;
  canvas.style.cursor = overDoor ? "pointer" : "default";
}
canvas.addEventListener("pointermove", aim);
canvas.addEventListener("pointerleave", () => { pointerOn = false; overDoor = false; });
canvas.addEventListener("pointerdown", e => { aim(e); if (overDoor) location.href = DOOR; });

let resizeTimer = 0;
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 48 : 32;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  if (geometry) buildWall();
}
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

const m4 = new THREE.Matrix4();
const pos = new THREE.Vector3();
const quat = new THREE.Quaternion();
const one = new THREE.Vector3(1, 1, 1);

function tick(ms) {
  const t = ms / 1000;
  const breathe = still.matches ? 0 : 0.04;
  aimed += ((pointerOn ? 1 : 0) - aimed) * 0.08;

  glowUniforms.uCenter.value.set(hit.x, hit.y);
  glowUniforms.uStrength.value = aimed;
  glowUniforms.uColor.value.lerp(overDoor ? DOOR_GLOW : GLOW, 0.12);
  backLight.position.set(hit.x, hit.y, -1.1);
  backLight.intensity = aimed * 40;
  backLight.color.copy(glowUniforms.uColor.value);

  for (let i = 0; i < cubes.length; i++) {
    const c = cubes[i];
    const d2 = (c.x - hit.x) ** 2 + (c.y - hit.y) ** 2;
    c.push += (aimed * PUSH * Math.exp(-d2 / SIGMA2) - c.push) * 0.14;
    pos.set(c.x, c.y, c.rest + Math.sin(t * 1.4 + c.phase) * breathe - c.push);
    m4.compose(pos, quat, one);
    mesh.setMatrixAt(i, m4);
  }
  mesh.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

geometry = await cubeGeometry();
resize();
buildWall();
requestAnimationFrame(tick);
</script>

</body>
</html>
