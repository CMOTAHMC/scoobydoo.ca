<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scoobydoo.ca</title>
<meta name="description" content="Just an old house on a hill.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dusk: #2B1D4A;
    --horizon: #7A4A7E;
    --moon: #F5E9B8;
    --mint: #DDF5E7;
    --van: #2F6B5E;
    --lamp: #F2A33A;
    --flower: #E8743B;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--dusk);
    color: var(--mint);
    font: 400 1.125rem/1.55 "Atkinson Hyperlegible", system-ui, sans-serif;
    overflow: hidden;
  }
  .scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .copy {
    position: relative;
    z-index: 1;
    max-width: 34rem;
    padding: clamp(2rem, 7vw, 5rem) clamp(1rem, 6vw, 5rem);
  }
  h1 {
    font: 400 clamp(2.75rem, 8vw, 5.5rem)/1 "Shrikhand", Georgia, serif;
    transform: rotate(-3deg);
    transform-origin: left bottom;
    text-shadow: 0.06em 0.06em 0 var(--flower);
    margin-bottom: 1.25rem;
  }
  .copy p { max-width: 26ch; opacity: 0.9; }

  .lit { fill: var(--lamp); filter: drop-shadow(0 0 6px rgba(242, 163, 58, 0.7)); }
  .dark { fill: #3A2A5E; }

  .secret circle.pane { fill: var(--lamp); transition: fill 0.2s, filter 0.2s; }
  .secret:hover circle.pane,
  .secret:focus-visible circle.pane {
    fill: #FFE08A;
    filter: drop-shadow(0 0 14px #FFE08A);
  }
  .secret:focus-visible { outline: none; }
  .secret:focus-visible circle.ring { stroke: var(--mint); stroke-width: 3; }
  .secret circle.hit { fill: transparent; }

  @media (prefers-reduced-motion: no-preference) {
    .secret circle.pane { animation: flicker 1.4s 2.5s 1 steps(1, end); }
  }
  @keyframes flicker {
    0%   { fill: var(--lamp); }
    10%  { fill: #3A2A5E; }
    18%  { fill: var(--lamp); }
    30%  { fill: #3A2A5E; }
    45%  { fill: #FFE08A; }
    100% { fill: var(--lamp); }
  }
</style>
</head>
<body>

<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="false" role="img" aria-labelledby="scene-title">
  <title id="scene-title">An old house on a hill under a full moon</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1D4A"/>
      <stop offset="0.75" stop-color="#7A4A7E"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <g fill="#F5E9B8" opacity="0.8">
    <circle cx="120" cy="420" r="2"/><circle cx="260" cy="340" r="1.5"/>
    <circle cx="520" cy="300" r="2"/><circle cx="1240" cy="140" r="1.5"/>
    <circle cx="1380" cy="260" r="2"/><circle cx="1500" cy="90" r="1.5"/>
    <circle cx="640" cy="120" r="1.5"/><circle cx="1120" cy="380" r="1.5"/>
  </g>

  <circle cx="940" cy="250" r="120" fill="#F5E9B8"/>

  <path d="M0,700 C300,620 600,640 900,660 C1100,670 1300,610 1600,640 L1600,900 L0,900Z" fill="#3E2C63"/>

  <!-- the house -->
  <g fill="#1E1535">
    <rect x="700" y="470" width="260" height="195"/>
    <polygon points="680,472 830,368 980,472"/>
    <rect x="920" y="380" width="70" height="285"/>
    <polygon points="910,382 955,290 1000,382"/>
    <rect x="735" y="400" width="18" height="50"/>
  </g>
  <rect class="lit"  x="730" y="500" width="30" height="44"/>
  <rect class="dark" x="780" y="500" width="30" height="44"/>
  <rect class="lit"  x="880" y="500" width="30" height="44"/>
  <rect class="dark" x="730" y="580" width="30" height="44"/>
  <rect class="dark" x="880" y="580" width="30" height="44"/>
  <rect class="dark" x="815" y="595" width="30" height="70"/>
  <rect class="dark" x="940" y="410" width="30" height="40"/>
  <rect class="lit"  x="940" y="500" width="30" height="40"/>

  <a class="secret" href="https://jellyfin.scoobydoo.ca" aria-label="Go inside">
    <circle class="hit" cx="830" cy="425" r="34"/>
    <circle class="ring" cx="830" cy="425" r="22" fill="none"/>
    <circle class="pane" cx="830" cy="425" r="17"/>
  </a>

  <!-- dead tree -->
  <g stroke="#1E1535" stroke-linecap="round" fill="none">
    <path d="M330,720 C325,640 340,560 320,470" stroke-width="16"/>
    <path d="M325,560 C290,530 270,500 240,490" stroke-width="7"/>
    <path d="M328,520 C360,490 390,480 420,440" stroke-width="7"/>
    <path d="M320,470 C310,430 300,410 280,390" stroke-width="5"/>
    <path d="M395,465 C410,450 440,452 455,445" stroke-width="4"/>
  </g>

  <path d="M0,790 C400,730 800,810 1200,765 C1400,745 1500,765 1600,755 L1600,900 L0,900Z" fill="#2F6B5E"/>
  <path d="M0,850 C300,820 700,860 1000,840 C1300,820 1450,845 1600,835 L1600,900 L0,900Z" fill="#1F4A44"/>
</svg>

<main class="copy">
  <h1>Nothing to see here.</h1>
  <p>Just an old house on a hill. The lights are on, but nobody's home.</p>
</main>

</body>
</html>
